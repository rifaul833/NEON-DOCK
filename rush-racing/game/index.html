<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Rush Racing</title>
  <style>
    html, body {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #4a7a9a;
      color: #fff;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .scenery-gutter {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 0;
      background-size: cover;
      background-repeat: repeat-y;
      background-position: center 0;
      pointer-events: none;
      transition: background-image 0.8s ease, background-color 0.8s ease;
    }

    #scenery-left {
      left: 0;
      border-right: 2px solid rgba(0, 0, 0, 0.25);
    }

    #scenery-right {
      right: 0;
      border-left: 2px solid rgba(0, 0, 0, 0.25);
    }

    #cnv {
      border: 0;
      position: absolute;
      z-index: 1;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
    }

    #scenery-label {
      position: fixed;
      left: 50%;
      top: 10px;
      z-index: 2;
      transform: translateX(-50%) translateY(-6px);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      font: 600 12px/1.2 system-ui, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #scenery-label.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <script src="famobi-api.js"></script>
  <script src="scenery.js?v=5"></script>
  <script>
    window.famobi_gameID = "speed-master";
  </script>
</head>
<body>
  <div id="scenery-left" class="scenery-gutter" aria-hidden="true"></div>
  <div id="scenery-right" class="scenery-gutter" aria-hidden="true"></div>
  <canvas id="cnv" tabindex="-1"></canvas>
  <div id="scenery-label" aria-live="polite"></div>
  <script>
    function g_start() {
      function g_tt() { return Date.now(); }
      function g_ff() { Module._sw_tick(g_tt()); }
      function g_cff() { g_ff(); g_ra(g_cff); }
      function g_p(a, f) { g_c[f](Array.prototype.join.call(a, " ")); }
      function g_scr() {
        g_s.src = typeof WebAssembly === "object" ? "app.js" : "app_asm.js";
        g_d.body.appendChild(g_s);
      }

      var g_d = document;
      var g_c = console || { log: function () {}, error: function () {} };
      var g_ra;
      var Module = {
        locateFile: function (path) {
          return path;
        },
        preRun: [function () { eso_init(g_wp); }],
        postRun: [
          function () {
            famobi_init();
            eso_post_init();
            Module._sw_init(g_tt());
            eso_upd_cnv();
            if (window.RushScenery) RushScenery.init();
            g_ra = window.requestAnimationFrame;
            if (typeof g_ra === "function") g_ra(g_cff);
            else window.setInterval(g_ff, 1000.0 / 60);
          },
        ],
        print: function () { g_p(arguments, "log"); },
        printErr: function () { g_p(arguments, "error"); },
        canvas: g_d.getElementById("cnv"),
      };
      var g_s = g_d.createElement("script");
      var g_i = new Image();
      var g_wp;

      window.Module = Module;

      g_i.onload = function () { if (this.width) g_wp = 1; g_scr(); };
      g_i.onerror = function () { g_scr(); };
      g_i.src =
        "data:image/webp;base64,UklGRkoAAABXRUJQVlA4WAoAAAAQAAAAAAAAAAAAQUxQSAwAAAARBxAR/Q9ERP8DAABWUDggGAAAABQBAJ0BKgEAAQAAAP4AAA3AAP7mtQAAAA==";
    }

    g_start();
  </script>
</body>
</html>
